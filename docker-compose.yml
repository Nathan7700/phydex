version: '3.8'

services:
  # Serviço do Banco de Dados Relacional (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: phydex_db
    restart: always
    environment:
      POSTGRES_USER: phydex_user
      POSTGRES_PASSWORD: phydex_password_secure2026
      POSTGRES_DB: phydex_prod
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - phydex_network

networks:
  phydex_network:
    driver: bridge

volumes:
  database_data:
    driver: local